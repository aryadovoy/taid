[build-system]
requires = ["uv_build>=0.11.12,<0.12"]
build-backend = "uv_build"

[project]
name = "taid"
version = "1.0.2"
description = "Telegram assistant userbot for message merging and music link normalization."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { file = "LICENSE" }
dependencies = [
    "pydantic-settings>=2.12,<3",
    "telethon>=1.44,<2",
]

[project.scripts]
taid = "taid.app:run"

[dependency-groups]
dev = [
    "basedpyright>=1.4.400",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.14,<0.15",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "C4", "E", "F", "I", "N", "PERF", "PL", "RUF", "SIM", "TCH", "UP", "W"]
fixable = ["ALL"]
ignore = ["PLR2004"]

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", ".pytest_cache", ".ruff_cache"]
pythonVersion = "3.13"
pythonPlatform = "Linux"
typeCheckingMode = "strict"
# Telethon ships without type stubs; confine its usage to the adapter module.
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
